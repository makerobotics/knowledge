[project]
name = "knowledge"
version = "0.1.0"
description = "Knowledge base"
readme = "README.md"
authors = [
    { name = "makerobotics", email = "yann.letzner@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.7.41",
    "langchain>=1.5.2",
    "langchain-openai>=1.8.5",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.24",
    "openai>=3.42.0",
    "openai-agents>=0.24.0",
    "pydantic>=2.14.2",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

# As we have a docs only project
[tool.uv]
package = false